    <style>
        .btn-subscribe{
            height: 20px;
            width: 80px;
            background-color: rgb(147, 5, 5);
            color: white;
            border: none;
            border-radius: 4px;
        }
        .js-size-double {
            font-size: 30px;
            height: 40px;
            width: 160px;
        }
    </style>
</head>
<body>
    <button class="btn-subscribe" type="button">Subscribe</button>
    <script>
        function doubleTheSize(){
            let buttonElement = document.querySelector('.btn-subscribe');
            buttonElement.classList.add('js-size-double');
        }

        document.querySelector('.btn-subscribe').addEventListener('click', doubleTheSize);
