<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Calculator</title>
    <link rel="stylesheet" href="Calculator.css">
</head>
<body>
    <div id="calculator">
        <input type="text" id="display" value="" readonly>
        <div class="button-container">
            <button type="button" class="button" onclick="clearDisplay()">C</button>
            <button type="button" class="button" onclick="appendValue('1')">1</button>
            <button type="button" class="button" onclick="appendValue('2')">2</button>
            <button type="button" class="button" onclick="appendValue('+')">+</button>
            <button type="button" class="button" onclick="appendValue('3')">3</button>
            <button type="button" class="button" onclick="appendValue('4')">4</button>
            <button type="button" class="button" onclick="appendValue('-')">-</button>
            <button type="button" class="button" onclick="appendValue('5')">5</button>
            <button type="button" class="button" onclick="appendValue('6')">6</button>
            <button type="button" class="button" onclick="appendValue('*')">*</button>
            <button type="button" class="button" onclick="appendValue('7')">7</button>
            <button type="button" class="button" onclick="appendValue('8')">8</button>
            <button type="button" class="button" onclick="appendValue('/')">/</button>
            <button type="button" class="button" onclick="calculateResult()">=</button>
            <button type="button" class="button" onclick="appendValue('9')">9</button>
            <button type="button" class="button" onclick="appendValue('0')">0</button>
            <button type="button" class="button" onclick="appendValue('.')">.</button>
        </div>
    </div>

    <script>
        let currentDisplay = '';

        function updateDisplay() {
            document.querySelector('#display').value = currentDisplay;
        }

        function appendValue(value) {
            if (value === '.' && currentDisplay.endsWith('.')) {
                return;
            }

            currentDisplay += value;
            updateDisplay();
        }

        function clearDisplay() {
            currentDisplay = '';
            updateDisplay();
        }

        function calculateResult() {
            try {
                if (currentDisplay.trim() === '') {
                    return;
                }
                const result = eval(currentDisplay);
                currentDisplay = String(result);
                updateDisplay();
            } catch (error) {
                currentDisplay = 'Error';
                updateDisplay();
            }
        }

        updateDisplay();
    </script>
</body>
</html>
