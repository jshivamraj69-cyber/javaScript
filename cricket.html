<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Cricket game</title>
    <link rel="stylesheet" href="cricket.css">
    <style>
    </style>
</head>
<body>
    <h1>Bat Ball Stump Game</h1>
    <p>Choose Bat, Ball, or Stump and watch the score update.</p>
    <div class="scoreboard">
        <div class="score-box">
            <strong>Rounds</strong>
            <span id="rounds">0</span>
        </div>
        <div class="score-box">
            <strong>User Wins</strong>
            <span id="userWins">0</span>
        </div>
        <div class="score-box">
            <strong>Computer Wins</strong>
            <span id="computerWins">0</span>
        </div>
        <div class="score-box">
            <strong>Ties</strong>
            <span id="ties">0</span>
        </div>
    </div>
    <div id="resultText">Waiting for your choice...</div>
    <div id="moving-ball">🏏</div>
    <button type="button" onclick="playGame('Bat')">Bat</button>
    <button type="button" onclick="playGame('Ball')">Ball</button>
    <button type="button" onclick="playGame('Stump')">Stump</button>

    <script>
        const matchState = {
            userScore: 0,
            computerScore: 0,
            ties: 0,
            rounds: 0,
            update(resultMessage) {
                this.rounds += 1;
                if (resultMessage === 'User won.') {
                    this.userScore += 1;
                } else if (resultMessage === 'Computer has won.') {
                    this.computerScore += 1;
                } else {
                    this.ties += 1;
                }
            }
        };

        const options = ['Bat', 'Ball', 'Stump'];

        function playGame(userChoice) {
            const computerChoice = options[Math.floor(Math.random() * options.length)];
            const resultMessage = getResultMessage(userChoice, computerChoice);
            matchState.update(resultMessage);
            updateDisplay(userChoice, computerChoice, resultMessage);
        }

        function getResultMessage(userChoice, computerChoice) {
            if (userChoice === computerChoice) {
                return 'It is a tie.';
            }

            const userWins =
                (userChoice === 'Bat' && computerChoice === 'Ball') ||
                (userChoice === 'Ball' && computerChoice === 'Stump') ||
                (userChoice === 'Stump' && computerChoice === 'Bat');

            return userWins ? 'User won.' : 'Computer has won.';
        }

        function updateDisplay(userChoice, computerChoice, resultMessage) {
            document.getElementById('rounds').textContent = matchState.rounds;
            document.getElementById('userWins').textContent = matchState.userScore;
            document.getElementById('computerWins').textContent = matchState.computerScore;
            document.getElementById('ties').textContent = matchState.ties;
            document.getElementById('resultText').textContent =
                `You chose ${userChoice}. Computer chose ${computerChoice}. ${resultMessage}`;
        }
    </script>
</body>
</html>
