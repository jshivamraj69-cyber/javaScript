<!DOCTYPE html>
<html lang="en">
<head>
    <title>Object Refrence</title>
</head>
<script>
    let a = 5;
    let b = a;
    console.log(`a=${a}, b=${b}`);
    a = 8;
    console.log(`a=${a}, b=${b}`);

    let x = {num: 5};
    let y = x;
    console.log(`x=${x.num}, y=${y.num}`);
    x.num = 8;
    console.log(`x=${x.num}, y=${y.num}`);

    let p = {pop: 'iuhj'};
    let q = {pop: 'ikju'};
    console.log(p == q);
</script>
<body>
</body>
</html>
